<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Phénix</title>
<meta name="description" content="Liens de Green Phénix : site, réseaux et prise de rendez-vous.">
<style>
  :root {
    --bg: #f6f4ee;
    --surface: #ffffff;
    --border: #e2ddcf;
    --text: #22301f;
    --text-muted: #5c6b57;
    --accent: #3d6b45;
    --accent-hover: #2e5335;
    --purple: #6b4e9e;
    --purple-hover: #57408a;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171c15;
      --surface: #1f261c;
      --border: #303a2b;
      --text: #eef0e8;
      --text-muted: #a7b39f;
      --accent: #7fb885;
      --accent-hover: #96c79b;
      --purple: #a48ed6;
      --purple-hover: #b6a3e0;
    }
  }

  :root[data-theme="dark"] {
    --bg: #171c15;
    --surface: #1f261c;
    --border: #303a2b;
    --text: #eef0e8;
    --text-muted: #a7b39f;
    --accent: #7fb885;
    --accent-hover: #96c79b;
    --purple: #a48ed6;
    --purple-hover: #b6a3e0;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }

  .wrap {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .mark {
    width: 84px;
    height: 84px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .mark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.25;
  }

  .tagline {
    margin: 0 0 36px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.85rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  a.link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.98rem;
    font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }

  a.link svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  a.link:hover,
  a.link:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  a.link:active {
    transform: scale(0.98);
  }

  a.link.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  a.link.primary:hover,
  a.link.primary:focus-visible {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #ffffff;
  }

  a.link.cta {
    background: var(--purple);
    border-color: var(--purple);
    color: #ffffff;
  }

  a.link.cta:hover,
  a.link.cta:focus-visible {
    background: var(--purple-hover);
    border-color: var(--purple-hover);
    color: #ffffff;
  }

  footer {
    margin-top: 44px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 12px);
    background: var(--text);
    color: var(--bg);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&display=swap">
</head>
<body>

<div class="wrap">
  <div class="mark">
    <img src="logo.png" alt="Logo Green Phénix">
  </div>
  <h1>Green Phénix by Anaïs Manchin</h1>
  <p class="tagline">Communication responsable &amp; conseils RSE</p>

  <nav>
    <a class="link primary" href="https://greenphenix.fr" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 6 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-6-3.8-9s1.3-6.3 3.8-9Z"/></svg>
      Site web
    </a>

    <a class="link" href="https://www.linkedin.com/in/ana%C3%AFs-manchin/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM3.34 8.75h3.2V21h-3.2V8.75Zm6.2 0h3.07v1.68h.04c.43-.8 1.47-1.65 3.03-1.65 3.24 0 3.84 2.1 3.84 4.84V21h-3.2v-5.7c0-1.36-.02-3.1-1.9-3.1-1.9 0-2.19 1.48-2.19 3v5.8h-3.2V8.75Z"/></svg>
      LinkedIn
    </a>

    <a class="link" href="https://www.instagram.com/greenphenix_" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="3.7"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>
      Instagram
    </a>

    <a class="link" id="mail-link" href="mailto:anais.manchin@greenphenix.fr" target="_blank" rel="noopener" data-email="anais.manchin@greenphenix.fr">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 6 8.5 6.5L20.5 6"/></svg>
      Email
    </a>

    <a class="link cta" href="https://calendly.com/anais-manchin-greenphenix/30min?month=2026-09" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/><path d="m9.3 14.3 1.9 1.9 3.5-3.6"/></svg>
      Réserver un appel découverte
    </a>
  </nav>

  <footer>Green Phénix — Nice</footer>
</div>

<div class="toast" id="toast">Adresse copiée</div>

<script>
  (function () {
    var link = document.getElementById('mail-link');
    var toast = document.getElementById('toast');
    var timer;

    link.addEventListener('click', function () {
      var email = link.getAttribute('data-email');
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email).catch(function () {});
        }
      } catch (e) {}

      toast.textContent = 'Adresse copiée : ' + email;
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(function () {
        toast.classList.remove('show');
      }, 2600);
    });
  })();
</script>

</body>
</html>
